[package]
name = "darkroom"
version = "0.1.0"
description = "Darkroom: a local-first, non-destructive photo editor"
edition = "2021"
rust-version = "1.85"

[lib]
name = "darkroom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rawler = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "gif", "bmp"] }
fast_image_resize = "6"
zstd = "0.13"
rayon = "1"
walkdir = "2"
kamadak-exif = "0.6"
img-parts = "0.4"
lcms2 = "6"
tiff = "0.10"
lru = "0.16"
parking_lot = "0.12"
chrono = "0.4"
thiserror = "2"
log = "0.4"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# rawler's CR2 sRAW/mRAW dummy decode trips a debug assertion on an uninitialised
# buffer; release builds never see it, so dev builds match release here.
[profile.dev.package.rawler]
debug-assertions = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
